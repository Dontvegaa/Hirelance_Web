spring.application.name=Hirelance

# --- BASE DE DATOS (HOSTINGER) ---
# Usamos la sintaxis ${VAR:valor_por_defecto}
# Si Render tiene variables, las usa. Si no, usa tus credenciales de Hostinger por defecto.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://srv1999.hstgr.io/u825468745_hirelance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:u825468745_hire}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Juas5378}

# --- ARREGLO HIKARI (CRÍTICO PARA HOSTINGER) ---
# Esto evita que la base de datos corte la conexión y te llene el log de errores WARN
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de sesion
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuracion de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Configuracion del servidor
server.port=${PORT:${SERVER_PORT:8000}}
spring.mvc.hiddenmethod.filter.enabled=true

# Configuracion archivos estaticos
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
app.upload.dir=./downloads/imagenes/

# --- CORREO ELECTRONICO (ARREGLO GMAIL) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lilvegaxx@gmail.com}
# Asegúrate de que esta contraseña sea la de 16 letras (sin espacios)
spring.mail.password=${MAIL_PASSWORD:xzzd nfrq bljm szps}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# PROPIEDADES DE SEGURIDAD PARA GMAIL EN LA NUBE (¡ESTO ARREGLA EL ERROR!)
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- URL BASE ---
app.base-url=${BASE_URL:http://localhost:8080}