spring.application.name=Hirelance

# --- BASE DE DATOS (HOSTINGER) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://srv1999.hstgr.io/u825468745_hirelance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:u825468745_hire}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Juas5378}

# --- OPTIMIZACION HIKARI (Mantiene la DB conectada) ---
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=20000

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de sesion
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuracion de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Configuracion del servidor
server.port=${PORT:${SERVER_PORT:8000}}
spring.mvc.hiddenmethod.filter.enabled=true

# Configuracion archivos estaticos
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
app.upload.dir=./downloads/imagenes/

# --- CORREO ELECTRONICO (GMAIL TLS 587 - ROBUSTO) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# Usamos 587 que es el estandar para STARTTLS
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:lilvegaxx@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xzzd nfrq bljm szps}

# Propiedades criticas para evitar TIMEOUTS en Render
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ¡ESTO ES LA CLAVE! Confiar en el certificado de Google evita que se congele la conexion
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Aumentar timeouts para Render (30 segundos)
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# --- URL BASE ---
app.base-url=${BASE_URL:http://localhost:8080}