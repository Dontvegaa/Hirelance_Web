spring.application.name=Hirelance

# --- DATABASE CONFIG (HOSTINGER) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://srv1999.hstgr.io/u825468745_hirelance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:u825468745_hire}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Juas5378}

# --- HIKARI POOL OPTIMIZATION ---
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=20000

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Session Config
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Config
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Server Config
server.port=${PORT:${SERVER_PORT:8000}}
spring.mvc.hiddenmethod.filter.enabled=true

# Static Resources Config
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
app.upload.dir=./downloads/imagenes/

# --- EMAIL CONFIG (SENDGRID - PORT 2525) ---
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.sendgrid.net
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- BASE URL ---
app.base-url=${BASE_URL:http://localhost:8080}