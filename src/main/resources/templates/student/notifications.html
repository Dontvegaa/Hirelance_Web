<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Notificaciones - Hirelance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white flex">

<aside class="w-64 min-h-screen bg-gray-900 border-r border-gray-800 p-6">
    <a href="/student/dashboard" class="text-2xl font-bold text-orange-500">Hirelance</a>
    <nav class="mt-10">
        <a href="/student/dashboard" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-tachometer-alt w-6 mr-2"></i> Dashboard
        </a>
        <a href="/student/search-projects" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-search w-6 mr-2"></i> Buscar Proyectos
        </a>

        <a href="/student/search-contractors" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-user-tie w-6 mr-2"></i> Buscar Contratistas
        </a>
        <a thref="/student/my-applications" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-file-alt w-6 mr-2"></i> Mis Postulaciones
        </a>
        <a href="/student/contracts" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-file-contract w-6 mr-2"></i> Mis Contratos
        </a>
        <a href="/student/profile" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-user-graduate w-6 mr-2"></i> Mi Perfil
        </a>
        <a href="/chat" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-envelope w-6 mr-2"></i> Mensajes
        </a>
        <a href="/student/notifications"
           class="block py-2 px-4 bg-orange-500 text-white rounded items-center ">
            <div class="flex items-center">
                <i class="fas fa-bell w-6 mr-2 group-hover:text-orange-500 transition-colors"></i>
                Notificaciones
            </div>

            <span th:if="${contadorNotificaciones > 0}"
                  th:text="${contadorNotificaciones}"
                  class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm animate-pulse">
    </span>
        </a>
        <a href="/student/report" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-bug w-6 mr-2"></i> reportar Problema
        </a>
        <a href="/student/settings" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-cog w-6 mr-2"></i> Ajustes
        </a>
    </nav>
</aside>

<main class="flex-1 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 border-b border-gray-800 pb-4">Centro de Notificaciones</h1>

        <div th:if="${#lists.isEmpty(notificaciones)}" class="text-center text-gray-500 py-12 bg-gray-900 rounded-lg border border-gray-800">
            <i class="fas fa-bell-slash text-6xl mb-4 opacity-50"></i>
            <p class="text-xl font-medium">Estás al día</p>
            <p class="text-sm mt-2">No tienes notificaciones nuevas.</p>
        </div>

        <div class="space-y-4">
            <a th:each="notif : ${notificaciones}"
               th:href="${notif.enlace != null} ? ${notif.enlace} : '#'"
               class="block p-5 rounded-lg border transition flex items-start gap-4 relative group decoration-0"
               th:classappend="${notif.leido} ? 'bg-gray-900 border-gray-800 text-gray-400' : 'bg-gray-800 border-orange-500/40 text-white hover:bg-gray-700 hover:border-orange-500'">

                <div class="mt-1 p-2 rounded-full bg-gray-800 border border-gray-700 shrink-0">
                    <span th:if="${notif.tipo.name() == 'proyecto'}" class="text-blue-400"><i class="fas fa-briefcase"></i></span>
                    <span th:if="${notif.tipo.name() == 'mensaje'}" class="text-green-400"><i class="fas fa-envelope"></i></span>
                    <span th:if="${notif.tipo.name() == 'valoracion'}" class="text-yellow-400"><i class="fas fa-star"></i></span>
                    <span th:if="${notif.tipo.name() == 'sistema'}" class="text-gray-400"><i class="fas fa-info-circle"></i></span>
                </div>

                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <p class="font-medium text-sm mb-1"
                           th:classappend="${!notif.leido} ? 'text-orange-400' : 'text-gray-500'"
                           th:text="${#strings.capitalize(notif.tipo.name())}">Tipo</p>
                        <span class="text-xs text-gray-600" th:text="${#temporals.format(notif.fecha, 'dd MMM, HH:mm')}">Fecha</span>
                    </div>

                    <p th:text="${notif.contenido}" class="leading-relaxed text-sm md:text-base"></p>

                    <p th:if="${notif.enlace != null}" class="text-xs text-orange-500 mt-2 font-semibold">
                        <i class="fas fa-external-link-alt mr-1"></i> Ver detalles
                    </p>
                </div>

                <div th:if="${!notif.leido}" class="absolute top-5 right-5 h-2 w-2 bg-orange-500 rounded-full shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
            </a>
        </div>
    </div>
</main>

</body>
</html>
