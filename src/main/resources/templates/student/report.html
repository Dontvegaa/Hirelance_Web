<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Reporte - Estudiante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white flex">

<aside class="w-64 min-h-screen bg-gray-900 border-r border-gray-800 p-6">
    <a href="/student/dashboard" class="text-2xl font-bold text-orange-500">Hirelance</a>
    <nav class="mt-10">
        <a href="/student/dashboard" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-tachometer-alt w-6 mr-2"></i> Dashboard
        </a>
        <a href="/student/search-projects" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-search w-6 mr-2"></i> Buscar Proyectos
        </a>
        <a href="/student/search-contractors" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-user-tie w-6 mr-2"></i> Buscar Contratistas
        </a>
        <a href="/student/my-applications" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-file-alt w-6 mr-2"></i> Mis Postulaciones
        </a>
        <a href="/student/contracts" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-file-contract w-6 mr-2"></i> Mis Contratos
        </a>
        <a href="/student/profile" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-user-graduate w-6 mr-2"></i> Mi Perfil
        </a>
        <a href="/chat" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-envelope w-6 mr-2"></i> Mensajes
        </a>
        <a href="/student/notifications"
           class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded flex justify-between items-center group transition">
            <div class="flex items-center">
                <i class="fas fa-bell w-6 mr-2 group-hover:text-orange-500 transition-colors"></i>
                Notificaciones
            </div>

            <span th:if="${contadorNotificaciones > 0}"
                  th:text="${contadorNotificaciones}"
                  class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm animate-pulse">
    </span>
        </a>
        <a href="/student/report" class="block py-2 px-4 bg-orange-500 text-white rounded">
            <i class="fas fa-bug w-6 mr-2"></i> Reportar Problema
        </a>
        <a href="/student/settings" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-cog w-6 mr-2"></i> Ajustes
        </a>
    </nav>
</aside>

<main class="flex-1">
    <header class="bg-gray-900 border-b border-gray-800 p-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Enviar Reporte</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </button>
        </form>
    </header>

    <div class="p-8">
        <div class="max-w-2xl mx-auto bg-gray-800 border border-gray-700 rounded-lg p-8">

            <div class="mb-6 text-center">
                <i class="fas fa-headset text-5xl text-orange-500 mb-4"></i>
                <h2 class="text-2xl font-bold text-white">¿En qué podemos ayudarte?</h2>
                <p class="text-gray-400 mt-2">Infórmanos sobre errores, problemas con usuarios o cualquier duda que tengas.</p>
            </div>

            <div th:if="${errorMessage}" class="bg-red-900 border border-red-700 text-red-300 px-4 py-3 rounded-md mb-6 text-center">
                <p th:text="${errorMessage}"></p>
            </div>

            <form th:action="@{/student/report}" th:object="${reporteDTO}" method="post">

                <div class="mb-6">
                    <label for="tipo" class="block text-sm font-medium text-gray-300 mb-2">Tipo de Reporte</label>
                    <select id="tipo" th:field="*{tipo}" required
                            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="bug">Reportar un error (Bug)</option>
                        <option value="fraude">Reportar fraude o abuso</option>
                        <option value="soporte">Soporte Técnico</option>
                        <option value="otro">Otro</option>
                    </select>
                    <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="text-red-400 text-sm mt-1"></span>
                </div>

                <div class="mb-6">
                    <label for="descripcion" class="block text-sm font-medium text-gray-300 mb-2">Descripción Detallada</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="6" required
                              class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                              placeholder="Por favor, describe el problema con el mayor detalle posible..."></textarea>
                    <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" class="text-red-400 text-sm mt-1"></span>
                </div>

                <div class="flex items-center justify-end space-x-4">
                    <a th:href="@{/student/dashboard}" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-md transition">
                        Cancelar
                    </a>
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-md transition">
                        <i class="fas fa-paper-plane mr-2"></i> Enviar Reporte
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>

</body>
</html>
