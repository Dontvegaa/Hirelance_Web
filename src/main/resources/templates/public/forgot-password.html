<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Hirelance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#f97316',
                        'secondary': '#000000',
                        'accent': '#1f2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-secondary text-white flex flex-col min-h-screen">

<header class="bg-secondary border-b border-gray-800">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center">
            <a href="/" class="text-2xl font-bold text-primary">
                <img th:src="@{/img/Hirelance-Logo-grupo19.png.png}" class="h-16 md:h-24 w-auto" alt="Hirelance Logo">
            </a>
        </div>
        <nav class="hidden md:flex space-x-6">
            <a href="/" class="hover:text-primary transition">Inicio</a>
            <a href="/login" class="hover:text-primary transition">Iniciar Sesión</a>
        </nav>
    </div>
</header>

<section class="flex-grow flex items-center justify-center py-8 px-4">
    <div class="max-w-md w-full bg-accent p-6 md:p-8 rounded-lg border border-gray-800">

        <div class="text-center mb-6">
            <i class="fas fa-lock text-4xl text-primary mb-4"></i>
            <h2 class="text-2xl md:text-3xl font-bold">Recuperar Contraseña</h2>
            <p class="text-gray-400 mt-2 text-sm">Ingresa tu correo y te enviaremos un enlace para restablecer tu acceso.</p>
        </div>

        <div th:if="${infoMessage}" class="bg-blue-900/50 border border-blue-700 text-blue-200 px-4 py-3 rounded-md mb-6 text-sm flex items-start" role="alert">
            <i class="fas fa-info-circle mt-1 mr-2"></i>
            <span th:text="${infoMessage}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium mb-2">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-3 bg-secondary border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-white placeholder-gray-500" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-orange-600 text-white py-3 rounded-md font-medium transition flex justify-center items-center gap-2">
                <span>Enviar enlace</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/login}" class="text-gray-400 hover:text-white text-sm transition flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i> Volver al Login
            </a>
        </div>
    </div>
</section>

<footer class="bg-secondary border-t border-gray-800 py-8">
    <div class="container mx-auto px-4 text-center text-gray-400">
        <p>&copy; 2025 Hirelance. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
