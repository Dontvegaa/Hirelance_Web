<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Hirelance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#f97316',
                        'secondary': '#000000',
                        'accent': '#1f2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-secondary text-white flex flex-col min-h-screen">

<header class="bg-secondary border-b border-gray-800">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center">
            <a href="/" class="text-2xl font-bold text-primary">
                <img th:src="@{/img/Hirelance-Logo-grupo19.png.png}" class="h-16 md:h-24 w-auto" alt="Hirelance Logo">
            </a>
        </div>
    </div>
</header>

<section class="flex-grow flex items-center justify-center py-8 px-4">
    <div class="max-w-md w-full bg-accent p-6 md:p-8 rounded-lg border border-gray-800">

        <h2 class="text-2xl md:text-3xl font-bold text-center mb-6">Crear Nueva Contraseña</h2>

        <div th:if="${errorMessage}" class="bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded-md mb-6 flex items-center" role="alert">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Nueva Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-3 bg-secondary border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-white" placeholder="••••••••" required minlength="8">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Confirmar Contraseña</label>
                <input type="password" name="confirmPassword" class="w-full px-4 py-3 bg-secondary border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-white" placeholder="••••••••" required minlength="8">
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-md font-medium transition shadow-lg shadow-green-900/20">
                Cambiar Contraseña
            </button>
        </form>
    </div>
</section>

<footer class="bg-secondary border-t border-gray-800 py-8">
    <div class="container mx-auto px-4 text-center text-gray-400">
        <p>&copy; 2025 Hirelance. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
