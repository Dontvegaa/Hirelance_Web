<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Contrato - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white flex">

<aside th:insert="~{admin/manage-contracts :: aside}"></aside>

<main class="flex-1">
    <header class="bg-gray-900 border-b border-gray-800 p-6 flex justify-between items-center">
        <div>
            <a th:href="@{/admin/manage-contracts}" class="text-sm text-orange-500 hover:underline flex items-center">
                <i class="fas fa-arrow-left mr-2"></i> Volver a Gestionar Contratos
            </a>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition text-sm">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </button>
        </form>
    </header>

    <div class="p-8">
        <div class="max-w-4xl mx-auto bg-gray-900 border border-gray-800 rounded-lg overflow-hidden shadow-2xl">

            <div class="bg-gray-800 p-6 border-b border-gray-700 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-400 uppercase tracking-wide font-semibold">Contrato #<span th:text="${contrato.idContrato}"></span></p>
                    <h1 class="text-3xl font-bold text-white mt-1" th:text="${contrato.proyecto?.titulo} ?: 'Sin Proyecto'">Título del Proyecto</h1>
                </div>

                <span class="px-4 py-2 rounded-full font-bold uppercase text-sm shadow-lg"
                      th:classappend="${contrato.estado.name() == 'activo'} ? 'bg-green-900 text-green-300 border border-green-700' :
                                     (${contrato.estado.name() == 'completado'} ? 'bg-blue-900 text-blue-300 border border-blue-700' : 'bg-red-900 text-red-300 border border-red-700')"
                      th:text="${contrato.estado}">ACTIVO</span>
            </div>

            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">

                <div class="bg-black p-6 rounded-lg border border-gray-700 hover:border-gray-600 transition">
                    <h3 class="text-gray-400 text-xs uppercase mb-4 font-bold tracking-wider">Detalles Financieros</h3>
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-sm text-gray-500 mb-1">Monto Total Acordado</p>
                            <p class="text-4xl font-bold text-orange-500" th:text="'$' + ${#numbers.formatDecimal(contrato.totalPago, 1, 2)}"></p>
                        </div>
                        <div class="p-3 bg-gray-900 rounded-full text-gray-600">
                            <i class="fas fa-money-bill-wave text-3xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-black p-6 rounded-lg border border-gray-700 hover:border-gray-600 transition space-y-4">
                    <h3 class="text-gray-400 text-xs uppercase mb-2 font-bold tracking-wider">Cronograma</h3>

                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400"><i class="fas fa-play text-green-600 mr-2"></i>Fecha Inicio:</span>
                        <span class="font-bold" th:text="${#temporals.format(contrato.fechaInicio, 'dd MMM yyyy')}"></span>
                    </div>

                    <div class="flex justify-between pt-1" th:if="${contrato.fechaFin}">
                        <span class="text-gray-400"><i class="fas fa-flag-checkered text-blue-500 mr-2"></i>Fecha Fin:</span>
                        <span class="font-bold text-blue-400" th:text="${#temporals.format(contrato.fechaFin, 'dd MMM yyyy')}"></span>
                    </div>

                    <div class="flex justify-between pt-1" th:if="${contrato.fechaFin == null}">
                        <span class="text-gray-400"><i class="fas fa-clock text-yellow-500 mr-2"></i>Estado actual:</span>
                        <span class="font-bold text-yellow-500 italic">En progreso...</span>
                    </div>
                </div>

                <div class="col-span-1 md:col-span-2 bg-black p-6 rounded-lg border border-gray-700">
                    <h3 class="text-gray-400 text-xs uppercase mb-6 font-bold tracking-wider text-center md:text-left">Partes Involucradas</h3>

                    <div class="flex flex-col md:flex-row justify-between items-center gap-8 md:gap-0 px-4">

                        <div class="flex items-center gap-4 w-full md:w-auto">
                            <div class="w-14 h-14 bg-gray-800 rounded-full flex items-center justify-center shrink-0 border border-gray-600 shadow-lg">
                                <i class="fas fa-user-tie text-blue-400 text-2xl"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase font-bold">Contratista</p>
                                <a th:href="@{/admin/manage-users/{id}/view(id=${contrato.contratista.idUsuario})}"
                                   class="text-lg font-bold hover:text-orange-500 transition block"
                                   th:text="${contrato.contratista.nombre} + ' ' + ${contrato.contratista.apellido}">
                                </a>
                                <p class="text-sm text-gray-600" th:text="${contrato.contratista.correo}"></p>
                            </div>
                        </div>

                        <div class="text-gray-700 rotate-90 md:rotate-0">
                            <i class="fas fa-handshake text-4xl"></i>
                        </div>

                        <div class="flex items-center gap-4 text-left md:text-right w-full md:w-auto flex-row md:flex-row-reverse">
                            <div class="w-14 h-14 bg-gray-800 rounded-full flex items-center justify-center shrink-0 border border-gray-600 shadow-lg">
                                <i class="fas fa-user-graduate text-green-400 text-2xl"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase font-bold">Estudiante</p>
                                <a th:href="@{/admin/manage-users/{id}/view(id=${contrato.estudiante.idUsuario})}"
                                   class="text-lg font-bold hover:text-orange-500 transition block"
                                   th:text="${contrato.estudiante.nombre} + ' ' + ${contrato.estudiante.apellido}">
                                </a>
                                <p class="text-sm text-gray-600" th:text="${contrato.estudiante.correo}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-1 md:col-span-2 text-center mt-4">
                    <a th:href="@{/admin/manage-contracts/{id}/pdf(id=${contrato.idContrato})}" target="_blank" class="text-gray-500 hover:text-white transition flex items-center justify-center mx-auto group">
                        <div class="p-2 bg-gray-800 rounded-full mr-2 group-hover:bg-gray-700 transition">
                            <i class="fas fa-file-pdf text-red-500"></i>
                        </div>
                        <span>Descargar PDF Oficial</span>
                    </a>
                </div>

            </div>
        </div>
    </div>
</main>
</body>
</html>
