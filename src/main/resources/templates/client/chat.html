<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Hirelance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Scroll automático al fondo del chat
        window.onload = function() {
            var chatBox = document.getElementById("chat-container");
            if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</head>
<body class="bg-black text-white flex h-screen overflow-hidden">

<aside class="w-64 min-h-screen bg-gray-900 border-r border-gray-800 p-6 flex-shrink-0 hidden md:block">
    <a href="/client/dashboard" class="text-2xl font-bold text-orange-500">Hirelance</a>
    <nav class="mt-10">
        <a href="/client/dashboard" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-tachometer-alt w-6 mr-2"></i> Dashboard
        </a>
        <a href="/client/post-project" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-plus w-6 mr-2"></i> Publicar Proyecto
        </a>
        <a href="/client/my-projects" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-tasks w-6 mr-2"></i> Mis Proyectos
        </a>
        <a href="/client/contracts"class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-file-contract w-6 mr-2"></i> Mis Contratos
        </a>
        <a href="/client/search-freelancer" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-search w-6 mr-2"></i> Buscar Talento
        </a>
        <a href="/chat" class="block py-2 px-4 bg-orange-500 text-white rounded">
            <i class="fas fa-envelope w-6 mr-2"></i> Mensajes
        </a>
        <a href="/client/notifications" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded flex justify-between items-center group">
            <div class="flex items-center">
                <i class="fas fa-bell w-6 mr-2 group-hover:text-orange-400 transition"></i>
                Notificaciones
            </div>
            <span th:if="${contadorNotificaciones > 0}"
                  th:text="${contadorNotificaciones}"
                  class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-full animate-pulse">
            </span>
        </a>
        <a href="/client/profile" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-user w-6 mr-2"></i> Mi Perfil
        </a>
        <a href="/client/settings" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded">
            <i class="fas fa-cog w-6 mr-2"></i> Ajustes
        </a>
    </nav>
</aside>

<main class="flex-1 flex flex-col h-full">

    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center flex-shrink-0">
        <h1 class="text-2xl font-bold">Mensajería</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm transition">
                Cerrar Sesión
            </button>
        </form>
    </header>

    <div class="flex-1 flex overflow-hidden">

        <div class="w-1/3 bg-gray-900 border-r border-gray-800 flex flex-col">

            <div class="p-4 border-b border-gray-800">
                <input type="text" placeholder="Buscar contacto..." class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
            </div>

            <div class="overflow-y-auto flex-1">

                <div th:if="${#lists.isEmpty(conversaciones)}" class="p-4 text-center text-gray-500 text-sm">
                    No tienes conversaciones activas.
                </div>

                <a th:each="convo : ${conversaciones}"
                   th:href="@{/chat/{id}(id=${convo.usuario.idUsuario})}"
                   class="flex items-center p-4 border-b border-gray-800 hover:bg-gray-800 cursor-pointer transition"
                   th:classappend="${chatActivo != null and chatActivo.idUsuario == convo.usuario.idUsuario} ? 'bg-gray-800 border-l-4 border-l-orange-500'">

                    <div class="relative">
                        <img th:if="${convo.foto != null}" th:src="'data:image/png;base64,' + ${convo.foto}" class="w-12 h-12 rounded-full object-cover bg-gray-700 border border-gray-600">
                        <div th:if="${convo.foto == null}" class="w-12 h-12 bg-orange-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-white"></i>
                        </div>
                    </div>

                    <div class="ml-4 overflow-hidden w-full">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-sm truncate" th:text="${convo.usuario.nombre} + ' ' + ${convo.usuario.apellido}">Nombre</p>
                            <span th:if="${convo.noLeidos != null and convo.noLeidos > 0}"
                                  th:text="${convo.noLeidos}"
                                  class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                            </span>
                        </div>
                        <p class="text-xs text-gray-400 truncate" th:text="${convo.ultimoMensaje}">Mensaje...</p>
                    </div>
                </a>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-black relative">

            <div th:if="${chatActivo == null}" class="flex-1 flex flex-col items-center justify-center text-gray-500">
                <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-comment-dots text-4xl text-orange-500"></i>
                </div>
                <p class="text-lg">Selecciona un estudiante para chatear</p>
            </div>

            <div th:if="${chatActivo != null}" class="flex-1 flex flex-col h-full">

                <div class="bg-gray-900 p-4 border-b border-gray-800 flex items-center flex-shrink-0">
                    <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center overflow-hidden">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div class="ml-3">
                        <p class="font-bold" th:text="${chatActivo.nombre} + ' ' + ${chatActivo.apellido}">Nombre</p>
                        <p class="text-xs text-green-400 flex items-center gap-1"><i class="fas fa-circle text-[8px]"></i> En línea</p>
                    </div>
                </div>

                <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4 bg-black/50">

                    <div th:each="msg : ${historial}" class="flex"
                         th:classappend="${msg.emisor.idUsuario == usuarioActual.idUsuario} ? 'justify-end' : 'justify-start'">

                        <div class="p-3 rounded-lg max-w-md text-sm shadow-md break-words"
                             th:classappend="${msg.emisor.idUsuario == usuarioActual.idUsuario} ?
                                             'bg-orange-500 text-white rounded-tr-none' :
                                             'bg-gray-800 text-gray-200 rounded-tl-none'">

                            <p th:text="${msg.contenido}">Mensaje</p>
                            <span class="text-[10px] opacity-70 block text-right mt-1"
                                  th:classappend="${msg.emisor.idUsuario == usuarioActual.idUsuario} ? 'text-orange-200' : 'text-gray-500'"
                                  th:text="${#temporals.format(msg.fechaEnvio, 'HH:mm')}">10:00</span>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-900 p-4 border-t border-gray-800 flex-shrink-0">
                    <form action="/chat/send" method="POST" th:object="${mensajeDTO}" class="flex items-center gap-2">
                        <input type="hidden" th:field="*{receptorId}" />

                        <input type="text" th:field="*{contenido}" required autocomplete="off"
                               class="flex-1 px-4 py-3 bg-gray-800 border border-gray-700 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-500 text-white placeholder-gray-500"
                               placeholder="Escribe tu mensaje...">

                        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white p-3 rounded-full w-12 h-12 flex items-center justify-center transition shadow-lg ml-3">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
